[project]
name = "imagen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wrossmorrow", email = "morrowwr@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "boto3>=1.43.92",
    "diffusers>=0.40.0",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "protobuf>=7.36.1",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "open_clip_torch>=2.32",
]

[project.scripts]
imagen = "imagen:main"
embed = "embed:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
