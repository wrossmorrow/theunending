[project]
name = "theunending"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wrossmorrow", email = "morrowwr@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.92",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "protobuf>=7.36.1",
    "httpx>=0.28.1",
    "tenacity>=9.2.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "modal>=1.6.3",
]

[project.scripts]
imagen = "imagen:main"
embed = "embed:main"
publish = "publish:main"

[build-system]
module-name = ["imagen", "publish"]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "imagen", "publish"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.123",
    "fastapi>=0.162.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
imagen = [
    "accelerate>=1.15.0",
    "diffusers>=0.40.0",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "open_clip_torch>=2.32",
]
publish = [
    "cryptography>=50.0.2",
    "pyjwt>=2.15.1",
]
