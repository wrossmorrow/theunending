services:

  # envoy, configured as with envoy.yaml
  envoy:
    image: "envoyproxy/envoy:${ENVOY_VERSION:-v1.35-latest}"
    command: envoy -c /etc/envoy/envoy.yaml --log-level ${ENVOY_LOG_LEVEL:-info} --service-node envoy-admin-1 --service-cluster theunending-admin
    ports:
      # listener
      - "8080:8080"
      # admin port
      - "9901:9901"
    volumes:
      - ${HOME}/deploy/envoy.yaml:/etc/envoy/envoy.yaml
      - /etc/envoy/secrets:/etc/envoy/secrets
    restart: unless-stopped

  # api to run; NOTE: listener not exposed on host, foces through envoy
  api:
    image: "${API_IMAGE_REGISTRY}/${API_IMAGE_NAME}:${API_IMAGE_TAG:-latest}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      JOB_BASE_URL: ${JOB_BASE_URL}
      GCP_WIF_PROVIDER: ${GCP_WIF_PROVIDER}
      GCP_SERVICE_ACCOUNT_EMAIL: ${GCP_SERVICE_ACCOUNT_EMAIL}
      MODAL_API_AUDIENCE: ${MODAL_API_AUDIENCE:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      PUBLISH_PRIVATE_SUBNET_IDS: ${PUBLISH_PRIVATE_SUBNET_IDS}
      PUBLISH_SECURITY_GROUP_ID: ${PUBLISH_SECURITY_GROUP_ID}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/alive"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # database, not exposed even with SG's
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${HOME}/deploy/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
