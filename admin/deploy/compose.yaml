services:

  # envoy, configured as with envoy.yaml to use extprocs
  envoy:
    image: "envoyproxy/envoy:${ENVOY_VERSION:-v1.35-latest}"
    command: envoy -c /etc/envoy/envoy.yaml --log-level ${ENVOY_LOG_LEVEL:-info}
    ports:
      # listener
      - "8080:8080"
      # admin port
      - "127.0.0.1:9901:9901"
    volumes:
      - ${HOME}/deploy/envoy.yaml:/etc/envoy/envoy.yaml
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy

  # extproc for auth, checks against static tokens
  auth:
    image: "${EXTPROC_IMAGE_REGISTRY}/${EXTPROC_IMAGE_NAME}:${EXTPROC_IMAGE_TAG:-latest}"
    command: ["--update-duration-header"]
    ports:
      # metrics (gRPC kept internal)
      - '127.0.0.1:9090:9090'
    volumes:
      - /opt/theunending/authorization:/opt/theunending/authorization
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/grpc-health-probe", "-addr=localhost:50051"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  # api to run; NOTE: listener not exposed on host, foces through envoy
  api:
    image: "${API_IMAGE_REGISTRY}/${API_IMAGE_NAME}:${API_IMAGE_TAG:-latest}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/alive"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # database, not exposed even with SG's
  postgres:
    image: postgres:18-alpine
    container_name: theunending-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${HOME}/deploy/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
