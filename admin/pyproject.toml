[project]
name = "theunending-admin-api"
version = "0.1.0"
description = "Admin API for The Unending"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "sqlmodel",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

