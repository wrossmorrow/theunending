services:

  # mock external job system for local runs and integration tests
  mock-jobs:
    image: ghcr.io/wrossmorrow/theunending/admin-mock-jobs
    build:
      context: .
      dockerfile: mocks/Dockerfile
    command: ["uvicorn", "mocks.jobs:api", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/alive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # api to run; NOTE: listener not exposed on host, foces through envoy
  api:
    image: ghcr.io/wrossmorrow/theunending/admin-api
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_BASE_URL: http://api:8000
      JOB_BASE_URL: http://mock-jobs:8080
      JOB_BEARER_TOKEN: ${JOB_BEARER_TOKEN:-dev-token}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-unending-local}
      S3_EVALUATE_PREFIX: ${S3_EVALUATE_PREFIX:-drafts}
      S3_BATCH_PREFIX: ${S3_BATCH_PREFIX:-runs}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
    volumes:
      - ${HOME}/data:/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mock-jobs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/alive"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # database, not exposed even with SG's
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
