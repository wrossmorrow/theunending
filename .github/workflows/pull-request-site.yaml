name: Build and Dry Run Site Deploy

on:
  pull_request:
    paths:
      - site/**

permissions:
  id-token: write
  contents: read

jobs:
  build-and-dry-run-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.PR_AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
        role-session-name: TheUnendingGASiteDryRun

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        working-directory: site
        bundler-cache: true
    
    - name: Build landing pool
      working-directory: site
      run: bash scripts/build-landing-pool.sh

    - name: Build Jekyll Site
      working-directory: site
      env:
        JEKYLL_ENV: production
      run: bundle exec jekyll build

    - name: Deploy to S3
      working-directory: site
      env:
        BUCKET: ${{ vars.SITE_S3_BUCKET }}
        DIST: ${{ vars.CLOUDFRONT_DIST_ID }}
      run: bash scripts/deploy.sh --dryrun
