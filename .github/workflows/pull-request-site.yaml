name: Build and Dry Run Site Deploy

on:
  pull_request:
    paths:
      - site/**

permissions:
  id-token: write
  contents: read

jobs:
  build-and-dry-run-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    
    - name: Show OIDC claims
      run: |
        t=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
        echo "$t" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref, event_name}'
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.PR_AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
        role-session-name: TheUnendingGASiteDryRun

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Build Jekyll Site
      working-directory: site
      env:
        JEKYLL_ENV: production
      run: |
        bundle exec jekyll build

    - name: Deploy to S3
      working-directory: site
      env:
        BUCKET: ${{ vars.SITE_S3_BUCKET }}
        DIST: ${{ vars.CLOUDFRONT_DIST_ID }}
      run: |
        bash scripts/deploy.sh --dry-run
