name: Build and Dry Run Site Deploy

on:
  pull-request:
    paths:
      - site/**

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.6'
        bundler-cache: true

    - name: Build Jekyll Site
      working_directory: site
      env:
        JEKYLL_ENV: production
      run: |
        bundle exec jekyll build

    - name: Deploy to S3
      working_directory: site
      env:
        BUCKET: ${{ vars.SITE_S3_BUCKET }}
        DIST: ${{ vars.CLOUDFRONT_DIST_ID }}
      run: |
        bash scripts/deploy.sh --dry-run
