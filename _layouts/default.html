<!DOCTYPE html>
<html lang="en">
<head>

  {%- comment -%} favicon + OG, same as the default layout {%- endcomment -%}
  {%- include head-meta.html -%}

  <!-- Google Fonts: EB Garamond & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Rendering math -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>

  <!-- Local CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/index-cards.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  
</head>
<body>
  <header>
    <h1>{{ site.title }}</h1>
  </header>
  <div class="site-bar">
    <nav>
      <a href="{{ '/' | relative_url }}">&larr;</a>&nbsp;&nbsp;
      <a href="{{ '/unending/' | relative_url }}">Listings</a>&nbsp;&nbsp;
      <a href="{{ '/about/' | relative_url }}">About</a>&nbsp;&nbsp;
      <a href="{{ '/printable/' | relative_url }}">Printable</a>&nbsp;&nbsp;
      <a href="{{ '/reviews/' | relative_url }}">Reviews</a>
    </nav>
    <hr>
  </div>
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
