# Every stream on the site, in one place.

defaults:
  base:     "https://theunending.ai/assets/img"
  ext:      ".png"
  ratio:    1        # tile width/height: 1 square, 1.5 = 3:2
  interval: 1000
  cols:     5
  rows:     4
  shuffle:  "true"
  mask:     "true"
  cols_min: 3
  cols_max: 7
  target_tile: 150
  theater_interval: 1000      # slower cadence on a wall
  theater_target_tile: 240    # bigger tiles than the inline default

sets:
  computation:
    base: "https://theunending.ai/assets/img/2026-09-12-computation/"
    manifest: "/assets/streams/computation.json"
    meta: "/assets/img/2026-09-12-computation/{id}.json"
